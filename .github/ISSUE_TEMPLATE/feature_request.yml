name: Feature request
description: Propose a capability with acceptance criteria
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep it compatible with PRD/ROADMAP.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable pass/fail.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Sandbox, permissions, secrets, multi-tenant.
