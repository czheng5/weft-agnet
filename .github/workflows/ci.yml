name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Installer smoke
        run: |
          sh -n install.sh
          sh install.sh --dry-run
      - name: Tests
        run: npm test
      - name: M0 demo
        run: npm run demo
      - name: v1 demo
        run: npm run demo:v1
      - name: Long-task acceptance
        run: npm run acceptance:long

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Installer dry run
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1 -DryRun
